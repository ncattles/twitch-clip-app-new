
events {
  worker_connections 1024;
}

http {
  # Tell nginx about file types (CSS, JS, images, etc.)
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Logging
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;

  # Performance settings
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  # Gzip compression (makes responses smaller/faster)
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

  # Upstream Flask app - tells nginx where Flask is running
  upstream flask_app {
      server unix:/tmp/gunicorn.sock fail_timeout=0;
  }

  # HTTP server - serves directly for local testing
  server {
    listen 80;
    server_name localhost;

    # Serve static files directly (CSS, JS, images)
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy everything else to Flask
    location / {
        proxy_pass http://flask_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ===== COMMENTED OUT FOR LOCAL TESTING =====
