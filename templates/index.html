<!doctype html>

<html>
  <head>
    <title>Mesiafy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/m.png') }}">
  </head>
  <body>
    <h1>Mesiafy</h1>
    <div>
      <h2>Enter a Twitch Channel</h2>
      {% if error %}
        <p class="error-message">{{ error }}</p>
      {% endif %}
      <form action="/" method="post">
        <input type="text" name="channel_name">
        <input id="submit" type="submit" value="Submit">
      </form>
    </div>
  </body>
</html>
