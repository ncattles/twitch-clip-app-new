<!doctype html>

<html>
  <head>
    <title>Mesiafy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/channels.css') }}">
  </head>
  <body>
    <header>
      <h1><a href="/" class="home-link">Mesiafy</a></h1>
    </header>

    <div class="controls-bar">
      <div class="controls-section">
        <span class="controls-label">Sort by:</span>
        <button id="sort-views" class="control-btn" data-sort="none">Views</button>
        <button id="sort-date" class="control-btn" data-sort="none">Date</button>
      </div>

      <div class="controls-section">
        <span class="controls-label">Filter by:</span>
        <select id="filter-game" class="filter-select">
          <option value="">All Games</option>
        </select>
        <select id="filter-creator" class="filter-select">
          <option value="">All Creators</option>
        </select>
      </div>

      <div class="controls-section">
        <button id="clear-filters" class="control-btn secondary">Clear Filters</button>
        <span id="clip-count" class="clip-count">Showing {{ clips|length }} clips</span>
      </div>
    </div>

    <div class="clips-grid">
      {% for clip in clips %}
        <div class="clip-card"
             data-page={{(loop.index0 // 20) + 1}}
             data-views="{{clip.view_count}}"
             data-date="{{clip.created_at}}"
             data-game="{{clip.game_name}}"
             data-creator="{{clip.creator_name}}">
          <a href="{{clip.url}}" target="_blank" class="thumbnail-link">
            <img src="{{clip.thumbnail_url}}" alt="{{clip.title}}" class="thumbnail">
          </a>
          <div class="clip-info">
            <h3 class="clip-title">{{clip.title}}</h3>
            <p class="clip-meta">
              <span class="streamer">{{clip.broadcaster_name}}</span>
              <span class="views">{{clip.view_count}} views</span>
            </p>
            <p class="clip-game">{{clip.game_name}}</p>
            <p class="clip-creator">Clipped by {{clip.creator_name}}</p>
            <p class="clip-date">{{clip.formatted_date}}</p>
          </div>
        </div>
      {% endfor %}
    </div>

    <div class="pagination">
      <button id="first-page" class="nav-btn">First</button>
      <button id="prev-page" class="nav-btn">← Prev</button>
      <span class="page-indicator">Page <span id="current-page">1</span> of <span id="total-pages">{{num_of_pages}}</span></span>
      <button id="next-page" class="nav-btn">Next →</button>
      <button id="last-page" class="nav-btn">Last</button>
    </div>
  </body>

  <script src="{{ url_for('static', filename='js/pagination.js') }}"></script>
</html>
